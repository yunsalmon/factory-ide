pid /tmp/nginx.pid;
events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip_static on;
  gzip_vary on;
  # Same-path application modules must revalidate each use; pinned runtime URLs
  # can be reused for a day, but are never marked immutable.
  map $uri $asset_cache_control {
    default "no-cache";
    ~^/vendor/pyodide/[0-9]+\.[0-9]+\.[0-9]+/ "public, max-age=86400, must-revalidate";
    ~^/runtime/ "public, max-age=0, must-revalidate";
    /browser-worker.js "public, max-age=0, must-revalidate";
    /browser-runtime.js "public, max-age=0, must-revalidate";
  }
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control $asset_cache_control always;
    location ^~ /api/ { return 404; }
    # The cache-eligible suffix must not turn binary WASM into executable JS.
    # Exact path prevents applying this type/cache policy to application scripts.
    location = /vendor/pyodide/0.27.7/pyodide.asm.wasm.js {
      types { }
      default_type application/wasm;
      limit_except GET { deny all; }
      try_files $uri =404;
    }
    # Pyodide's Emscripten loader requires generated code. Scope that permission to
    # the isolated worker response; the document itself retains a strict script CSP.
    location = /browser-worker.js {
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'self'; object-src 'none'; base-uri 'none'" always;
      add_header Cache-Control $asset_cache_control always;
      try_files $uri =404;
    }
    location / { limit_except GET { deny all; } try_files $uri $uri/ =404; }
  }
}
